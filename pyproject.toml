[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lm-brain-tuning"
version = "0.1.0"
description = "Reproduction code for What Brain Data Adds to Language Model Training"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = "MIT"
authors = [
  {name = "Gabriele Merlin"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
lm-brain-tuning = "lm_brain_tuning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lm_brain_tuning = ["paper.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
